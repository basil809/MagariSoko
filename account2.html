            z-index: 1; 
            left: 0;
            top: 15%;
            width: 100%; 
            height: 100%; 
            overflow: auto;

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch User's data from the server
                const response = await fetch('https://magarisoko-backend.onrender.com/api/user-info', { credentials: 'include' });
                const result = await response.json();

                if (result.username) {
                    const user = result; // username and other fields returned

                    if (!user) {
                        alert('User data not found.');
                        return;
                    }

                    // Create user card
                    const userCard = `
                        <div class="card">
                            <div class="user_icon">
                                <img src="images/user_icon/account_circle_24dp_5F6368_FILL0_wght400_GRAD0_opsz24.svg" alt="user_icon">
                            </div>
                            <h1>${user.username}</h1>
                            <p>Email: ${user.email}</p>
                            <p>Password: <strong style="font-size:30px;">••••••••</strong></p>
                            <div class="actionBtn">
                                <button class="btn btn-warning editUser" style="width: 100px;" data-id="${user._id}">Edit</button>
                                <button class="btn btn-danger deleteUser" style="width: 100px;" data-id="${user._id}">Delete</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('user-card-container').innerHTML = userCard;

                    // Attach event listeners after rendering
                    document.addEventListener('click', async (e) => {
                        const editBtn = e.target.closest('.editUser');
                        if (editBtn) {
                            const userId = editBtn.getAttribute('data-id');
                            console.log("User ID captured on edit click:", userId);
                            document.getElementById('editUserId').value = userId;
                        
                            // Save ID to a hidden field or in JS for submission
                            document.getElementById('editUserId').value = userId;

                            // Fetch existing user data from server
                            const res = await fetch(`https://magarisoko-backend.onrender.com/api/user-info?id=${userId}`, { credentials: 'include' });
                            const data = await res.json();

                            if (data.success) {
                                document.getElementById('editUsername').value = data.dealer.username;
                                document.getElementById('editEmail').value = data.dealer.email;
                                // password field can be left blank
                            }

                            // Show the modal
                            document.getElementById('editUserModal').style.display = 'block';

                            //Close the modal when the close button is clicked
                            const modal = document.getElementById('editUserModal');
                            const closeButton = modal.querySelector('.close');
                            closeButton.addEventListener('click', () => {
                                modal.style.display = 'none';
                            });
                        }

                    });

                    // Handle deletion of user account
                    document.querySelector('.deleteUser').addEventListener('click', async () => {
                        if (confirm('Are you sure you want to delete your Account?')) {
                            const res = await fetch (`/delete-user/${user._id}`, { method: 'DELETE' });
                            const result = await res.json();
                            if (result.success) {
                                alert('User deleted successfully.');
                                const card = document.querySelector('.card');
                                card.classList.add('fade-out');

                                setTimeout(() => {
                                    window.location.href = '/'; // Redirect to homepage after 1.5s
                                }, 1500)
                            } else {
                                alert('Failed to delete user.');
                            }
                        }
                    });

                    // Handle form submission to update user data
                    document.getElementById('EditUserForm').addEventListener('submit', async (e) => {
                        e.preventDefault();

                        const id = document.getElementById('editUserId').value;
                        const username = document.getElementById('editUsername').value;
                        const email = document.getElementById('editEmail').value;
                        const password = document.getElementById('editPassword').value;

                        const res = await fetch('/update-user', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ id, username, email, password })
                        });

                        const result = await res.json();
                        if (result.success) {
                            alert('User updated successfully!');
                            location.reload(); // or close modal and update DOM
                        } else {
                            alert('Failed to update user.');
                        }
                    });

                } else {
                    alert('An error occurred while fetching user data.');
                    console.error('Failed to fetch user data:', result.message);
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
            }
        });
    </script>
