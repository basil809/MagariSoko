    <style>
        :root{
            --orange:#ff5722;
            --dark: #0a0a0a;
            --muted: #f4f4f4;
            --card-border: #e6e6e6;
            --background-image: url("public/images/background.png");
        }

        main{
            display: block;
            padding: 20px;
            padding-left: 10px;
            
        }
        /* Styles the main background section */
        .breadcrumb-header-section {
            background-image: url("images/background.png");
            /* Light gray background color from the image */
            /* Bootstrap's py-5 handles padding top/bottom */
        }

        /* Styles the main title "Product Details" */
        .breadcrumb-header-section h1 {
            color: #333;
            font-size: 36px; /* Adjust size to match image scale */
        }

        /* Styles the breadcrumb links */
        .breadcrumb-item a {
            color: #777; /* Medium gray color for links */
            text-decoration: none; /* Removes underline from links */
        }

        .breadcrumb-item a:hover {
            color: var(--orange); /* Optional: A subtle hover color */
        }

        /* Styles the active item "Product Details" */
        .breadcrumb-item.active {
            color: var(--orange); /* Keeps the active item the same color as the links */
            font-weight: normal; /* Ensures it's not bolded by default BS styles */
        }

        .content_display{
            display: block;
            border-radius: 5px;
            padding-bottom: 100px; /* Make space for the button */
        }
        
        /* For smaller screens, stack the items vertically */
        @media (max-width: 768px){
            .menu_2 .list li a span{
                display: none;
            } 
        }

        h1{
            text-align: center;
        }
        #account-form{
            display: flex;
            padding: 10px;
            justify-content: center;
            align-items: center;
        }
        #account-form label,
        #account-form input {
            margin: 10px 0;
        }
        #account-form label{
            font-weight: bold;
        }
        #account-form input{
            width: 40%;
        }
        .UpdateBtn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .UpdateBtn button{
            background-color: white;
            color: #4CAF50;
            border: 2px solid #4CAF50;
            border-radius: 5px;
        }
        .UpdateBtn button:hover{
            background-color: #4CAF50;
            color: white;
        }
        .user_icon{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .user_icon img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;;
        }
        .card p{
            font-weight: bold;
        }
        #dealerEdit.modal{
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        #dealerEdit h2{
            text-align: center;
            padding-bottom: 10px;
            font-weight: bold;
        }
        #dealerEdit .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .fade-out {
        animation: fadeOut 1s ease forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.98);
            }
        }
    </style>

        </div>
    </nav>
</head>
<body>
<main>
    <section class="breadcrumb-header-section">
        <div class="container py-5"> <!-- py-5 adds padding top and bottom -->
            <!-- Centered Main Title -->
            <h1 class="text-center mb-3">Account Settings</h1>
            
            <!-- Centered Breadcrumb Navigation -->
            <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center bg-transparent m-0 p-0">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item"><a href="dealers.html">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Settings</li>
            </ol>
            </nav>
        </div>
    </section>
    <div id="dealerEdit" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Personal Data</h2>
            <div class="row"></div>
            <form id="edit-dealer-form">
                <input type="hidden" id="dealerId" name="dealerId" >
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="username"><strong>Username:</strong></label>
                            <input type="text" name="username" id="user_name"  class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="id_no"><strong>ID No:</strong></label>
                            <input type="text" name="id_no" id="user_idNo" class="form-control" readonly>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone_number"><strong>Phone Number:</strong></label>
                            <input type="text" name="phone_number" id="phone_Number"  class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email"><strong>Email:</strong></label>
                            <input type="email" name="email" id="user_email" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="address"><strong>Address:</strong></label>
                            <input type="text" name="address" id="user_address" class="form-control" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>
    <section class="content_display">
        <div class="container">
            <div id="account-info">
                <!--user inform will dynamically be displayed here-->
        </div>
    </section>

</main>
